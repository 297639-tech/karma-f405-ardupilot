name: Build Karma F405 ArduPilot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ArduPilot
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          ref: Copter-4.5
          submodules: 'recursive'

      - name: Patch Config for Direct Boot
        run: |
          cd libraries/AP_HAL_ChibiOS/hwdef/FlywooF405Pro
          # Полностью перенаправляем барометр на шину I2C1
          sed -i '/I2C_ORDER/d' hwdef.dat
          sed -i '/BARO/d' hwdef.dat
          echo "I2C_ORDER I2C1" >> hwdef.dat
          echo "BARO BMP280 I2C:1:0x77" >> hwdef.dat
          
          # Отключаем аналоговый чип OSD
          sed -i '/MAX7456/d' hwdef.dat
          sed -i '/OSD/d' hwdef.dat
          
          # Заставляем компилятор собрать бинарник под прямую заливку с адреса 0x08000000 (без бутлоадера)
          sed -i 's/FLASH_RESERVE_START_KB [0-9]*/FLASH_RESERVE_START_KB 0/g' hwdef.dat
          sed -i 's/FLASH_BOOTLOADER_LOAD_KB [0-9]*/FLASH_BOOTLOADER_LOAD_KB 0/g' hwdef.dat

          cd ../include
          echo "#define HAL_MINIMIZE_FEATURES 1" >> minimize_common.inc
          echo "#define OSD_ENABLED 1" >> minimize_common.inc

      - name: Install Base Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi build-essential ccache git make wget python3-pip python3-setuptools
          pip3 install empy==3.3.4 flake8 future lxml pymavlink

      - name: Compile Custom Firmware
        run: |
          ./waf configure --board FlywooF405Pro
          ./waf copter

      - name: Collect Direct Bin File
        run: |
          mkdir ready-firmware
          # Находим чистый бинарник приложения без смещения адресов
          find build/ -type f -name "arducopter.bin" -exec cp {} ./ready-firmware/ \;
          ls -la ./ready-firmware/

      - name: Upload Finished Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KarmaF405_ArduPilot_Firmware
          path: ready-firmware/
