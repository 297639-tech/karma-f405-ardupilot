name: Build Karma F405 ArduPilot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone ArduPilot Repository
        run: |
          git clone --depth 1 --branch Copter-4.5 https://github.com
          cd ardupilot
          git submodule update --init --recursive

      - name: Patch Flywoo Config for Karma F405
        run: |
          cd ardupilot/libraries/AP_HAL_ChibiOS/hwdef/FlywooF405Pro
          # Полностью переписываем блок барометра, привязав BMP280 к шине I2C1 дрона Karma
          sed -i '/I2C_ORDER/d' hwdef.dat
          sed -i '/BARO/d' hwdef.dat
          echo "I2C_ORDER I2C1" >> hwdef.dat
          echo "BARO BMP280 I2C:1:0x77" >> hwdef.dat
          
          # Жестко активируем режим минимизации функций, чтобы прошивка влезла в 1 МБ памяти чипа F405
          cd ../include
          echo "#define HAL_MINIMIZE_FEATURES 1" >> minimize_common.inc

      - name: Install Base Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi build-essential ccache git make wget python3-pip python3-setuptools
          pip3 install flake8 future lxml pymavlink

      - name: Compile Custom Firmware
        run: |
          cd ardupilot
          ./waf configure --board FlywooF405Pro
          ./waf copter

      - name: Upload Finished Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KarmaF405_ArduPilot_Firmware
          path: ardupilot/build/FlywooF405Pro/bin/arducopter.hex
